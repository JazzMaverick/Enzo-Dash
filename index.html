<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Nameless Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--p:#0e0c09fc;--p2:#2a2114;--i:#ddd3b8;--g:#c9a55a;--ln:#c9a55a44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--p:#0a0907fc;--p2:#251d12;--i:#e2d8bd;--g:#d4b062;--ln:#d4b06244}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0a08;color:#eadfbf;font:500 18px/1.35 "Cormorant Garamond",Garamond,Georgia,serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
.o{position:fixed;pointer-events:none;text-shadow:0 1px 4px #000,0 0 2px #000}
#hud{left:16px;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.b{height:10px;margin:5px 0;background:#000a;border:1px solid #d9b25a88;max-width:60vw}
.b i{display:block;height:100%;transition:width .15s}
#hp i{background:linear-gradient(#c8392c,#7a140e)}#fp i{background:linear-gradient(#5582e0,#22408a)}#st i{background:linear-gradient(#6aa85e,#2e5e2a)}#tb i,#bb i{background:linear-gradient(#c8392c,#7a140e)}
.dn{margin-left:14px;color:#f1d98a}
#vig{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 48%,#000c 100%)}
#low{inset:0;background:radial-gradient(transparent 38%,#7a0c06 100%);opacity:0}
#stx{font-size:15px;color:#ffb38a}
#gl{right:16px;bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:22px;color:#f1d98a}
#quick{left:16px;bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.q{width:58px;height:58px;border:1px solid #d9b25a88;background:#000a;position:relative}
.q img{width:44px;height:44px;margin:7px}
.q b{position:absolute;left:3px;top:0;font-size:13px;color:#f1d98a}
.q u{position:absolute;right:4px;bottom:0;font-size:15px;text-decoration:none}
#boss{left:50%;transform:translateX(-50%);bottom:calc(11% + env(safe-area-inset-bottom,0px));width:min(640px,84vw);display:none;font-size:21px}
#boss .b{max-width:none;height:9px}
#tgt{left:50%;transform:translateX(-50%);top:calc(9% + env(safe-area-inset-top,0px));width:min(280px,60vw);text-align:center;display:none;font-size:16px}
#tgt .b{max-width:none;height:6px}
#area{left:0;right:0;top:22%;text-align:center;font-size:clamp(26px,5.5vw,56px);letter-spacing:.16em;color:#f1e4b0;opacity:0;transition:opacity 1.4s}
#area:after{content:"";display:block;height:1px;margin:6px auto 0;width:min(520px,70vw);background:linear-gradient(90deg,transparent,#d9b25a,transparent)}
#big{left:0;right:0;top:38%;padding:14px 0;text-align:center;font-size:clamp(34px,8vw,92px);letter-spacing:.13em;opacity:0;transition:opacity 1.2s;background:linear-gradient(90deg,transparent,#000c 25%,#000c 75%,transparent)}
#msg,#pr,#sub{left:0;right:0;text-align:center;padding:0 14px}
#msg{bottom:calc(27% + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .6s;color:#f1d98a}

#lb1{top:0}#lb2{bottom:0}.lb.on{height:11vh}
#red{inset:0;background:radial-gradient(transparent 45%,#8a140e);opacity:0}

.card,.pane{background:var(--p);color:var(--i);border:1px solid var(--g);box-shadow:0 0 0 4px var(--p),0 0 0 5px var(--ln)}
.card{padding:22px 30px;max-width:min(600px,94vw);max-height:92%;overflow:auto;text-align:center}
.card h1,.card h2,.pane h2{margin:0 0 8px;color:var(--g);font-weight:700;letter-spacing:.06em}
.card h1{font-size:34px;letter-spacing:.3em}
.card p{margin:10px 0}
.lore{font-style:italic;opacity:.9}
.sg{background:#14110c;border-radius:50%;padding:8px}
.pane{width:min(940px,96vw);height:min(620px,92%);display:flex;flex-direction:column}
.pane nav{display:flex;flex-wrap:wrap;gap:2px;padding:8px 10px;border-bottom:1px solid var(--ln);align-items:center}
.pane nav span{margin-left:auto;color:var(--g)}
.cols{display:grid;grid-template-columns:1fr 1.15fr;flex:1;min-height:0}
.list{overflow:auto;border-right:1px solid var(--ln)}
.det{overflow:auto;padding:16px 20px}

.row.on{background:var(--p2)}

table{border-collapse:collapse;width:100%}td{padding:2px 6px;border-bottom:1px solid var(--ln)}td:last-child{text-align:right}

</style>
</head>

<div id="quick" class="o"><div class="q"><b>R</b><img id="q0" alt=""><u id="q0n"></u></div><div class="q"><b>Q</b><img id="q1" alt=""></div><div class="q"><b>F</b><img id="q2" alt=""></div></div>
<div id="gl" class="o"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ===== core helpers =====

const GC={},bg=(w,h,d,rr)=>{const k=w+','+h+','+d+','+(rr||0);return GC[k]||(GC[k]=rbox(w,h,d,rr))};

// ===== the eight regions =====

 {n:'Mirelake',g:0x3a5468,f:0x4c6478,mo:0xbfe6ff,a:0x223840,b:0x4a6862},{n:'Rotmoor',g:0x6e261d,f:0x7a3020,mo:0xff9a6a,a:0x3a1510,b:0x7c3620},
 {n:'The Gilded Heights',g:0x8e6c26,f:0x806530,mo:0xffe08a,a:0x57461c,b:0xa07c2a},{n:'Cinder Scar',g:0x2a201f,f:0x52241a,mo:0xff7a2a,up:1,a:0x1a1413,b:0x3a2a28},
 {n:'Frostcrown',g:0xaeb8c4,f:0x5e6a7a,mo:0xffffff,a:0x7f8c9c,b:0xd9e1ea},{n:'The Umbral Hollows',g:0x2a2236,f:0x231d31,mo:0xb48cff,a:0x1a1524,b:0x372b49}];

const AR=Z.map((_,k)=>{const q=zp(k,178);return{x:q[0],z:q[1],k,y:H0(q[0],q[1])}}); // boss arenas, flattened

// worn dirt tracks: a ring road linking the lightwells and a spoke from each toward the great tree

// ===== renderer, light, shared textures =====
const rd=new T.WebGLRenderer({canvas:$('c'),antialias:true}),sc=new T.Scene(),cam=new T.PerspectiveCamera(58,1,.3,1000),FT=new T.Color();
rd.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));sc.background=new T.Color(0x4a4636);sc.fog=new T.Fog(0x4a4636,10,185);

const SUN=new T.DirectionalLight(0xffd9a0,.95);SUN.castShadow=true;SUN.shadow.mapSize.set(2048,2048);
{const c=SUN.shadow.camera;c.left=c.bottom=-42;c.right=c.top=42;c.near=5;c.far=230;c.updateProjectionMatrix()}
SUN.shadow.bias=-.0006;SUN.shadow.normalBias=.04;sc.add(new T.HemisphereLight(0xcfc0a0,0x15141c,.55),SUN,SUN.target);
rd.shadowMap.enabled=true;rd.shadowMap.type=T.PCFSoftShadowMap;
const shad=g=>g.traverse(o=>{if(o.isMesh&&o.material!==shM)o.castShadow=true});
const glowT=ctex(64,64,x=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.25,'#fffa');g.addColorStop(1,'#fff0');x.fillStyle=g;x.fillRect(0,0,64,64)},0,1);

 w_axe:{n:'Stitcher’s Axe',k:'w',ty:'axe',d:30,sp:.85,rc:2.5,sc:{str:'B'},rq:{str:14},wc:0xc9a03a,ic:['ax','#c9a03a'],l:'Gorvane took the arms of stronger men and sewed them to his own. This axe was held by five hands at once, and none of them his.'},
 w_anchor:{n:'Widow’s Anchor',k:'w',ty:'anchor',d:46,sp:.6,rc:3.2,sc:{str:'A'},rq:{str:20},wc:0x56636a,ic:['an','#7a8a92'],l:'She dragged it up the beach every dusk, certain the fleet would need it. The fleet never came home. The anchor never stopped being heavy.'},
 w_moon:{n:'Moonwake Greatsword',k:'w',ty:'great',d:30,sp:.8,rc:3,sc:{int:'B',str:'D'},rq:{int:16},wc:0xbfe0ff,wg:0x2a5a8a,ic:['gs','#bfe0ff'],l:'A blade of cold light, passed from headmistress to heir. Ysolde had no heir, so she kept it, and kept the moon with it.'},
 w_twin:{n:'Starbreaker',k:'w',ty:'great',d:42,sp:.7,rc:3.2,sc:{str:'B'},rq:{str:22},wc:0x8a8f96,ic:['gs','#b0553a'],l:'Brannoch learned to hold back the stars so that his old, thin steed would never have to carry his full weight. The blade remembers the strain.'},
 w_horn:{n:'Horned King’s Edge',k:'w',ty:'katana',d:30,sp:1.1,rc:2.7,sc:{dex:'B',arc:'C'},rq:{dex:16},wc:0xf1d98a,ic:['ka','#f1d98a'],l:'Hidden inside a beggar’s cane. Morvath was born cursed and unwanted, and guarded the throne of those who cast him out until the very end.'},
 w_maw:{n:'Maw of the World-Eater',k:'w',ty:'spear',d:35,sp:.9,rc:3.5,sc:{str:'C',fai:'B'},rq:{fai:16},wc:0xff6a2a,wg:0x7a2a00,ic:['sp','#ff6a2a'],l:'A fang as long as a pike. Vessk fed himself to a serpent so that he might one day swallow the gods. He is still hungry.'},
 w_petal:{n:'The Unbowed Petal',k:'w',ty:'katana',d:33,sp:1.25,rc:2.8,sc:{dex:'A'},rq:{dex:20},wc:0xf4f8fc,ic:['ka','#f4f8fc'],l:'Sevrine never knew defeat. The rot took her arm, her sight and her name, and still the blade moved like falling petals.'},
 w_fang:{n:'The Black Fang',k:'w',ty:'great',d:37,sp:.95,rc:3,sc:{dex:'B',fai:'B'},rq:{dex:16,fai:16},wc:0x2a2a30,wg:0x4a0000,ic:['gs','#5a2a2a'],l:'Death itself was sealed inside this blade and given to a faithful beast to guard. He guarded it so long he forgot it was a punishment.'},
 w_hunt:{n:'Hunter’s Fang',k:'w',ty:'katana',d:27,sp:1.15,rc:2.7,sc:{dex:'B',arc:'D'},rq:{dex:12},wc:0xdfe6ee,ic:['ka','#dfe6ee'],l:'Corvin’s blade. He hunted the Red Hands across every land until the yellow flame hunted him. He asked your forgiveness. Keep the edge clean.'},
 c_rod:{n:'Apprentice’s Rod',k:'c',ty:'staff',mg:'sorcery',d:18,sc:{int:'C'},rq:{int:10},ic:['st','#7fd6ff'],l:'A student’s rod from the drowned academy. Every scratch on the grip is a failed exam.'},
 c_star:{n:'Fallen-Star Staff',k:'c',ty:'staff',mg:'sorcery',d:26,sc:{int:'S'},rq:{int:12},grav:1.3,ic:['st','#ff9a4a'],l:'Carved from a rock that fell beside the blighted lake. It asks little of its wielder and answers intellect in full. Stone sorceries are drawn to it.'},
 c_charm:{n:'Pilgrim’s Charm',k:'c',ty:'charm',mg:'prayer',d:18,sc:{fai:'B'},rq:{fai:10},ic:['ch','#f1d98a'],l:'A knot of gold thread and tree bark. Pilgrims pressed these to their brows and asked the light for small things.'},
 a_way:{n:'Wayfarer’s Wraps',k:'a',df:.06,wt:0,lk:{c:'#4a4a52',t:'#8a7a5a',p:4,ft:1,hc:'#7a7f86'},ic:['ar','#6a6a72'],l:'Travel-stained cloth over dented plate. What the Faded were buried in, and what they woke in.'},
 a_mail:{n:'Footman’s Mail',k:'a',df:.16,wt:1,lk:{c:'#5a6048',t:'#b9a04a',p:0,ft:1,hc:'#8a8f96'},ic:['ar','#8a9a6a'],l:'Mail of the Mournvale levy. The tabard’s crest has been unpicked, stitch by stitch, by someone who no longer wished to be found.'},
 a_robe:{n:'Acolyte’s Robe',k:'a',df:.09,wt:0,bn:{mind:3,int:2},lk:{c:'#2f4f7a',t:'#9fd0ff',p:2,ft:4,hc:'#c9d6e8'},ic:['ar','#4f7fba'],l:'Robe of the lakebound academy. The stone mask hides the face so that only the mind may be judged. Raises Mind and Intellect.'},
 a_night:{n:'Nightcloak',k:'a',df:.14,wt:0,bn:{dex:3},lk:{c:'#1e1826',t:'#8a5ad6',p:2,ft:2,hc:'#1e1826',cape:0x15121c},ic:['ar','#5a3f8a'],l:'Worn by those who keep the Hollows. It drinks torchlight and footfalls alike. Raises Dexterity.'},
 a_fur:{n:'Frost-Kin Furs',k:'a',df:.2,wt:1,bn:{vig:3},lk:{c:'#8aa0b8',t:'#f4f8fc',p:7,ft:0,hc:'#c8b8a8'},ic:['ar','#c8d8e8'],l:'Pelts of the last giants’ hounds. Warm enough to make the Frostcrown feel like a kindness. Raises Vigor.'},
 a_gilt:{n:'Gilded Plate',k:'a',df:.28,wt:2,lk:{c:'#b08a2a',t:'#fff0a8',p:3,ft:1,hc:'#d6b04a',cape:0x7a1f1f},ic:['ar','#e0b85a'],l:'Plate of the tree’s own knights, gilded to match the boughs they swore to. Heavy with gold, heavier with oaths.'},
 a_bell:{n:'Bellkeeper’s Mantle',k:'a',df:.34,wt:2,bn:{end:2},lk:{c:'#6a6a70',t:'#b08a3a',p:3,ft:2,hc:'#4a4a55'},ic:['ar','#9a9aa5'],l:'Stone-grey armour found in the wreck of a walking belfry. Its keeper rode inside for an age, ringing for souls that never came.'},
 s_shard:{n:'Star Shard',k:'s',mg:'sorcery',fp:6,m:1,rq:{int:10},ic:['sl','#8fd0ff'],l:'The first sorcery taught at the academy: a splinter of starlight, thrown. Simple, quick, and enough.'},
 s_lance:{n:'Comet Lance',k:'s',mg:'sorcery',fp:14,m:2.2,rq:{int:16},ic:['sl','#cfe6ff'],l:'A great bolt that passes through everything in its path. Its makers stared at the night sky until the sky stared back.'},
 s_stone:{n:'Stone Hurl',k:'s',mg:'sorcery',fp:12,m:.95,rq:{int:12},ic:['sl','#c08a5a'],l:'Tears three rocks from the earth and flings them. A sorcery of the falling stars, strongest through a staff of the same stone.'},
 s_mend:{n:'Mending Light',k:'s',mg:'prayer',fp:14,rq:{fai:10},ic:['sl','#f1d98a'],l:'A small prayer to the great tree. It closes wounds and asks nothing, which is why few trust it.'},
 s_ember:{n:'Ember Toss',k:'s',mg:'prayer',fp:9,m:1.5,rq:{fai:12},ic:['sl','#ff7a2a'],l:'A fistful of the Scar’s own fire, thrown in an arc. The monks say the flame once belonged to a giant, and wants to go home.'},
 s_oath:{n:'Oath of Gold',k:'s',mg:'prayer',fp:20,rq:{fai:14},ic:['sl','#ffe08a'],l:'An old knightly vow. For a time, blows land harder and wounds bite less. Warriors stack such blessings before a great foe.'},
 t_leap:{n:'War Cinder: Leaping Fang',k:'t',fp:12,ic:['ci','#ff9a4a'],l:'A battle art bound into a cinder. Somersault forward and bring the weapon down with your whole weight.'},
 t_step:{n:'War Cinder: Mist Step',k:'t',fp:5,ic:['ci','#9fd0ff'],l:'A battle art of hunters. Vanish for a breath and reappear a few strides away, untouched.'},
 t_spin:{n:'War Cinder: Storm Circle',k:'t',fp:10,ic:['ci','#c8f0c0'],l:'A battle art of the stormbound hills. Spin with weapon outstretched, cutting everything near.'},
 h_hound:{n:'Echo Ashes: Lone Hound',k:'h',fp:20,ic:['as','#9fd0ff'],l:'Ashes that remember a loyal hound. Scatter them and its echo fights beside you until it fades.'},
 h_squire:{n:'Echo Ashes: Fallen Squire',k:'h',fp:30,ic:['as','#cfe6ff'],l:'Ashes of a squire who died before earning a name. His echo still wants very badly to be useful.'},
 u_dawn:{n:'Vial of Dawn',k:'u',ic:['vi','#c23a2e'],l:'Red tears of the great tree. Restores health. Refills whenever you rest at a lightwell.'},
 u_dusk:{n:'Vial of Dusk',k:'u',ic:['vi','#3a67c9'],l:'Blue tears of the great tree. Restores focus for sorceries, prayers and battle arts. Refills at a lightwell.'},
 u_pot:{n:'Fire Pot',k:'u',ic:['po','#ff7a2a'],l:'A clay pot of pitch and bad intentions. Throw it. Stand back.'},
 u_moss:{n:'Blightbane Moss',k:'u',ic:['mo','#8ac04a'],l:'Bitter moss from the edge of the red lake. Chew it to purge the blight.'},
 u_marrow:{n:'Gilded Marrow',k:'u',ic:['po','#f1d98a'],l:'Glint grown hard inside old bones. Crush it to gain 800 glint.'},
 k_whistle:{n:'Gale’s Whistle',k:'k',ic:['ke','#cfd8dc'],l:'Given by the veiled guide. Calls Gale, a steed who has chosen you and does not explain why.'},
 k_sealL:{n:'Sundered Seal (left)',k:'k',ic:['ke','#d9b25a'],l:'Half of a great seal. Somewhere a lift waits for the whole of it.'},
 k_sealR:{n:'Sundered Seal (right)',k:'k',ic:['ke','#d9b25a'],l:'Half of a great seal. No map says where its twin lies, nor what it opens.'},
 k_seal:{n:'The Twin Seal',k:'k',ic:['ke','#fff0b0'],l:'Both halves, joined. It wakes the great lift where the snow cliffs fall into the shadow of the tree.'},
 k_seed:{n:'Vial Seed',k:'k',ic:['mo','#f1d98a'],l:'A golden seed. Each one found lets your Vial of Dawn hold one more draught.'},
 k_n1:{n:'Torn Page: The Shattering',k:'k',ic:['pg','#e8dcc0'],l:'“When the Circlet broke, the Queen was not seen again. Her children each took a shard and called it a crown. Not one of them was wrong, and that was the war.”'},
 k_n2:{n:'Torn Page: The Lift',k:'k',ic:['pg','#e8dcc0'],l:'“Two keepers held two halves, one in a fort at the far edge of the green vale, one where the ground still burns. The lift stands where the white cliffs meet the roots.”'},
 k_n3:{n:'Torn Page: The Outer Dark',k:'k',ic:['pg','#e8dcc0'],l:'“There are things beyond the sky that want this land: a rot, a flame, a hunger. Each chose a scion to whisper to. Ask what whispered to yours.”'},
 k_shard:{n:'Crown Shard',k:'k',ic:['sh','#fff0b0'],l:'A fragment of the Circlet, taken from a fallen scion. Eight were hoarded. Bring them all to the door at the roots of the great tree.'}
};
